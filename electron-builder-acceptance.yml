appId: app.progressledger.v2
productName: Progress Ledger v2
copyright: "Copyright © 2026 Progress Ledger"

directories:
  output: release/acceptance-test

asar: true
asarUnpack:
  - core/*.node
  - node_modules/better-sqlite3/**/*.node

files:
  - package.json
  - shell/**/*
  - ui/dist/**/*
  - core/index.js
  - core/index.d.ts
  - core/package.json
  - core/*.node
  - core/migrations/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Progress Ledger v2
  uninstallDisplayName: Progress Ledger v2

publish:
  provider: github
  owner: your-github-username
  repo: ProgressLedger
  releaseType: release
